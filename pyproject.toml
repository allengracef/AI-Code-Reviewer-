[project]
name = "ai-codereviwer"
version = "0.1.0"
description = "AI-powered code review API — combines static analysis (ruff / pattern-based JS) with Groq LLM review to surface bugs, security issues, and best-practice violations."
readme = "README.md"
authors = [
    { name = "allengracef", email = "allengracefrancis@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "python-dotenv>=1.0.0",
    "groq>=0.10.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0.52",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "pydantic-settings>=2.0.0",
    "pydantic[email]>=2.0.0",
    "tenacity>=8.0.0",
]


[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "pytest>=8.0.0",
    "httpx2>=2.0.0",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
