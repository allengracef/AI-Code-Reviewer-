[project]
name = "ai-codereviwer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "allengracef", email = "allengracefrancis@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "python-dotenv>=1.0.0",
    "groq>=0.10.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.18",
]

[project.scripts]
ai-codereviwer = "ai_codereviwer:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "pytest>=8.0.0",
    "httpx>=0.25.0",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
